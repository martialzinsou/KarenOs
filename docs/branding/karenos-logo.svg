<?xml version="1.0" encoding="UTF-8"?><!-- Auteur : Martial Zinsou -->
<!-- Logo KarenOS — style Facebook / Meta : monogramme "K" en ruban dégradé bleu → cyan -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="meta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A81FF"/>
      <stop offset="50%" stop-color="#0087FF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
  </defs>

  <!-- Squircle blanc (style icône Meta) -->
  <rect x="32" y="32" width="960" height="960" rx="215" fill="#FFFFFF"/>

  <!-- Monogramme "K" en ruban dégradé -->
  <g fill="none" stroke="url(#meta)" stroke-width="170" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 520 800 C 470 620 470 430 500 240"/>
    <path d="M 505 470 C 600 380 680 320 800 190"/>
    <path d="M 505 520 C 640 640 740 760 830 852"/>
  </g>
</svg>