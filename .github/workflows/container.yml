name: Container (GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push llama-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Packaging/container/Dockerfile
          push: true
          tags: |
            ghcr.io/martialzinsou/karenos/karenos-llama-server:latest
            ghcr.io/martialzinsou/karenos/karenos-llama-server:${{ steps.tag.outputs.version }}